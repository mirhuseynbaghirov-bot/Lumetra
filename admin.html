<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Lumetra — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Giriş -->
<div class="login" id="loginBox">
  <h1>Lumetra admin</h1>
  <label for="em">E-poçt</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Şifrə</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" id="loginBtn" style="margin-top:18px;width:100%;justify-content:center">Daxil ol</button>
  <p id="loginErr" style="color:var(--red);margin-top:12px;font-size:.9rem"></p>
</div>

<!-- Panel -->
<div class="wrap" id="app" hidden>
  <header class="top">
    <a class="brand" href="index.html">Lumetra<i></i></a>
    <div style="display:flex;gap:10px;align-items:center">
      <span class="counter" id="count"></span>
      <a class="btn ghost sm" href="index.html" target="_blank">Sayta bax</a>
      <button class="btn ghost sm" id="logout">Çıxış</button>
    </div>
  </header>

  <div class="quota" id="quota"></div>

  <div class="layout">
    <section class="panel">
      <h2 style="margin-bottom:6px">Yeni məhsul</h2>
      <label>Şəkil</label>
      <label class="drop" for="file" id="drop"><span>Şəkil seçmək üçün toxunun</span></label>
      <input id="file" type="file" accept="image/*" hidden>
      <label for="name">Ad</label><input id="name" maxlength="60">
      <div class="two">
        <div><label for="price">Qiymət</label><input id="price" type="number" min="0" step="0.01"></div>
        <div><label for="stock">Stok (ədəd)</label><input id="stock" type="number" min="0" step="1"></div>
      </div>
      <label for="desc">Qısa təsvir (istəyə bağlı)</label><textarea id="desc" maxlength="140"></textarea>
      <button class="btn" id="add" style="margin-top:18px;width:100%;justify-content:center">Məhsulu əlavə et</button>
    </section>

    <section class="panel">
      <h2 style="margin-bottom:6px">Mövcud məhsullar</h2>
      <div id="list"><p style="color:var(--mute)">Yüklənir…</p></div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig, ADMIN_EMAIL, MAX_PRODUCTS, STORAGE_LIMIT_MB, CURRENCY } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);
const col = collection(db, "products");
const $ = id => document.getElementById(id);
const QUOTA_MSG = "Yaddaş kotası dolub. Bir məhsulu silib yenidən sınayın.";
const LIMIT_BYTES = STORAGE_LIMIT_MB * 1024 * 1024;
let usedBytes = 0, itemCount = 0;
const mb = b => (b / 1048576).toFixed(1);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let imageData = "";

function toast(msg, err){
  const t = $("toast"); t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  setTimeout(() => t.className = "toast", 2800);
}

/* ---------- Giriş / çıxış ---------- */
$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); }
  catch { $("loginErr").textContent = "E-poçt və ya şifrə yanlışdır."; }
};
$("logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if (user && user.email === ADMIN_EMAIL){
    $("loginBox").hidden = true; $("app").hidden = false; loadList();
  } else {
    if (user) { signOut(auth); $("loginErr").textContent = "Bu hesabın admin icazəsi yoxdur."; }
    $("loginBox").hidden = false; $("app").hidden = true;
  }
});

/* ---------- Şəkil: brauzerdə sıxılır, Firestore-da saxlanır (Storage pulsuz deyil) ---------- */
$("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const max = 900, k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    let q = .8; imageData = c.toDataURL("image/jpeg", q);
    while (imageData.length > 350000 && q > .35){ q -= .08; imageData = c.toDataURL("image/jpeg", q); }
    $("drop").innerHTML = `<img src="${imageData}" alt="Önizləmə">`;
  };
  img.src = URL.createObjectURL(f);
};

/* ---------- Kota bildirişi ---------- */
function showQuota(){
  const q = $("quota"); q.textContent = QUOTA_MSG; q.classList.add("show");
  q.classList.remove("shake"); void q.offsetWidth; q.classList.add("shake");
  window.scrollTo({ top: 0, behavior: "smooth" });
  toast(QUOTA_MSG, true);
}

/* ---------- Siyahı ---------- */
async function loadList(){
  const snap = await getDocs(query(col, orderBy("createdAt", "desc")));
  const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  itemCount = items.length;
  usedBytes = items.reduce((t, p) => t + (p.image?.length || 0) + 1000, 0);   // base64 simvol ≈ 1 bayt
  $("count").textContent = `${items.length} məhsul · ${mb(usedBytes)} / ${STORAGE_LIMIT_MB} MB`;
  const full = usedBytes >= LIMIT_BYTES || (MAX_PRODUCTS && items.length >= MAX_PRODUCTS);
  if (full) showQuota(); else $("quota").classList.remove("show");

  $("list").innerHTML = items.length ? items.map(p => `
    <div class="item" data-id="${p.id}">
      <img src="${p.image}" alt="">
      <div>
        <strong>${esc(p.name)}</strong>
        <div class="edit">
          <input type="number" min="0" step="0.01" value="${p.price}" data-f="price" aria-label="Qiymət">
          <input type="number" min="0" step="1" value="${p.stock}" data-f="stock" aria-label="Stok">
          <button class="btn sm ghost" data-act="save">Yadda saxla</button>
        </div>
      </div>
      <button class="btn sm danger" data-act="del">Sil</button>
    </div>`).join("") : '<p style="color:var(--mute)">Hələlik məhsul yoxdur. Soldakı formadan ilk məhsulu əlavə edin.</p>';
}

$("list").onclick = async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const row = b.closest(".item"), id = row.dataset.id;
  if (b.dataset.act === "del"){
    if (!confirm("Bu məhsul silinsin?")) return;
    await deleteDoc(doc(db, "products", id)); toast("Silindi"); loadList();
  } else {
    const price = parseFloat(row.querySelector('[data-f="price"]').value);
    const stock = parseInt(row.querySelector('[data-f="stock"]').value, 10);
    if (isNaN(price) || isNaN(stock)) return toast("Qiymət və stoku düzgün yazın", true);
    await updateDoc(doc(db, "products", id), { price, stock }); toast("Yadda saxlanıldı");
  }
};

/* ---------- Əlavə et ---------- */
$("add").onclick = async () => {
  const name = $("name").value.trim();
  const price = parseFloat($("price").value);
  const stock = parseInt($("stock").value, 10);
  if (!imageData) return toast("Şəkil seçin", true);
  if (!name || isNaN(price) || isNaN(stock)) return toast("Ad, qiymət və stoku doldurun", true);

  $("add").disabled = true;
  try {
    if (usedBytes + imageData.length > LIMIT_BYTES || (MAX_PRODUCTS && itemCount >= MAX_PRODUCTS)){ showQuota(); return; }
    await addDoc(col, { name, price, stock, desc: $("desc").value.trim(), image: imageData, createdAt: serverTimestamp() });
    imageData = ""; ["name","price","stock","desc","file"].forEach(i => $(i).value = "");
    $("drop").innerHTML = "<span>Şəkil seçmək üçün toxunun</span>";
    toast("Məhsul əlavə olundu"); await loadList();
  } catch (e) {
    console.error(e);
    if (e.code === "resource-exhausted") showQuota();   // Firebase özü kotanın dolduğunu bildirsə
    else toast("Xəta: əlavə edilmədi", true);
  }
  finally { $("add").disabled = false; }
};
</script>
</body>
</html>
